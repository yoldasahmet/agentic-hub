name: Release

# docs/release.md. A pushed tag vX.Y.Z builds the dmg + zip for arm64 and
# x64 and uploads them, with latest-mac.yml for auto-update, to a draft
# GitHub Release. Running it by hand ("Run workflow") is a dry run: the
# same build, kept as workflow artifacts, and no release.
#
# Signing and notarization (P18.3) turn on when these secrets exist:
#   MAC_CERTIFICATE_P12_BASE64, MAC_CERTIFICATE_PASSWORD   Developer ID Application
#   APPLE_API_KEY_P8_BASE64, APPLE_API_KEY_ID, APPLE_API_ISSUER   App Store Connect API key
# Without them the build is unsigned (it opens only via right-click → Open).
#
# Auto-update reads public GitHub Releases. RELEASES_REPO can target a
# separate public repository by its full owner/name. Set RELEASES_TOKEN
# with write access to that repository when publishing there.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mac:
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # One runner builds both archs, so it needs both Postgres binary
      # packages (they are optional, per platform). The lockfile has both.
      - name: Install (both Mac archs)
        run: |
          printf '\nsupportedArchitectures:\n  os: [current]\n  cpu: [arm64, x64]\n' >> pnpm-workspace.yaml
          pnpm install --frozen-lockfile
      - name: Check the tag against versions and the changelog
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          node scripts/release.mjs check "$GITHUB_REF_NAME"
          node scripts/release.mjs notes "$GITHUB_REF_NAME" > release-notes.md
      - name: Lint and type check
        run: pnpm lint && pnpm check-types
      - name: Build, sign, notarize, and publish
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN || secrets.GITHUB_TOKEN }}
          RELEASES_REPO: ${{ vars.RELEASES_REPO }}
          HAS_RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN != '' }}
          MAC_CERTIFICATE_P12_BASE64: ${{ secrets.MAC_CERTIFICATE_P12_BASE64 }}
          MAC_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        shell: bash
        run: |
          if [ -n "$MAC_CERTIFICATE_P12_BASE64" ]; then
            export CSC_LINK="$MAC_CERTIFICATE_P12_BASE64" CSC_KEY_PASSWORD="$MAC_CERTIFICATE_PASSWORD"
          else
            echo "::warning::No signing certificate: building unsigned (P18.3 is blocked)."
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          if [ -n "$APPLE_API_KEY_P8_BASE64" ]; then
            echo "$APPLE_API_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/notary-key.p8"
            export APPLE_API_KEY="$RUNNER_TEMP/notary-key.p8"
          else
            unset APPLE_API_KEY_ID APPLE_API_ISSUER
          fi
          publish=never
          target="${RELEASES_REPO:-$GITHUB_REPOSITORY}"
          if [[ ! "$target" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo "::error::The release repository must be in owner/name form."
            exit 1
          fi
          extra=(
            -c.publish.provider=github
            "-c.publish.owner=${target%/*}"
            "-c.publish.repo=${target#*/}"
            -c.publish.releaseType=draft
          )
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            if [ "$target" != "$GITHUB_REPOSITORY" ] && [ "$HAS_RELEASES_TOKEN" != "true" ]; then
              echo "::error::Set RELEASES_TOKEN to publish in another repository."
              exit 1
            fi
            publish=always
            extra+=(-c.releaseInfo.releaseNotesFile=../../release-notes.md)
          fi
          pnpm --filter @agentic/desktop package --mac --arm64 --x64 --publish "$publish" "${extra[@]}"
      - name: Smoke check the packaged app
        env:
          RELEASES_REPO: ${{ vars.RELEASES_REPO }}
        run: |
          node apps/desktop/scripts/check-package.mjs "apps/desktop/release/mac-arm64/Agentic Hub.app" \
            "${RELEASES_REPO:-$GITHUB_REPOSITORY}"
      - name: Keep the dry-run build
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: agentic-mac
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
          retention-days: 7
