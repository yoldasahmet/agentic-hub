name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, so a new advisory against an unchanged lockfile still turns CI red.
  schedule:
    - cron: "17 6 * * 1"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint (Biome, layer rules, file size)
        run: pnpm lint
      - name: Type check
        run: pnpm check-types

  tests:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Unit, integration (ephemeral Postgres), and UI tests with coverage
        run: pnpm test:coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  # The packaging pipeline (P18, docs/release.md) on a cheap runner: an
  # unpacked Linux build exercises the same config, resources, and fuses.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Package (unpacked, unsigned)
        run: pnpm --filter @agentic/desktop package --linux dir --publish never
      - name: Smoke check the packaged app
        run: node apps/desktop/scripts/check-package.mjs apps/desktop/release/linux-unpacked

  # Dependency policy (docs/security.md): no known high or critical advisory
  # in what ships. Dev-only findings are reviewed through Dependabot.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high
